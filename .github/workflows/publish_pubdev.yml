name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish (for example: v0.1.2).
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve publish tag
        id: resolve-tag
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            manual_tag="${{ github.event.inputs.ref }}"
            if [[ -n "$manual_tag" ]]; then
              tag="$manual_tag"
            fi
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Publishing is only allowed from version tags like v0.1.2. Received: $tag"
            exit 1
          fi

          if [[ "$tag" == "${{ github.ref_name }}" && "${{ github.ref_type }}" != "tag" ]]; then
            echo "This run is on a branch ref (${{ github.ref_name }}). Publishing requires a tag ref."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Verify tag matches pubspec version
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail

          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          expected_tag="v$version"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match pubspec version $version."
            exit 1
          fi

      - name: Analyze package
        run: dart analyze

      - name: Validate package for publishing
        run: dart pub publish --dry-run

      - name: Publish package
        run: dart pub publish --force