name: flutter_mock_server
description: A local mock API server for Flutter and Dart with YAML config, static/stateful routes, CRUD simulation, deterministic seeded data, and hot reload.
version: 1.0.0
homepage: https://github.com/NJashwanth/flutter_mock_server
repository: https://github.com/NJashwanth/flutter_mock_server
issue_tracker: https://github.com/NJashwanth/flutter_mock_server/issues
topics:
  - flutter
  - mock-server
  - api-mocking
  - testing
  - cli

environment:
  sdk: ^3.3.0

dependencies:
  args: ^2.6.0
  path: ^1.9.1
  shelf: ^1.4.2
  uuid: ^4.5.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15

executables:
  flutter_mock: flutter_mock
